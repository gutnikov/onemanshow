name: label image
description: Publishes a destination-labelled derivative of an already-built image.
inputs:
  image: { description: Registry path, required: true }
  sha: { description: Commit of the built image, required: true }
  service: { description: Service name the destination expects in the label, required: true }
  destination: { description: Destination name, used as the tag suffix, required: true }
runs:
  using: composite
  steps:
    - shell: sh
      run: >-
        "${{ github.action_path }}/label-image"
        "${{ inputs.image }}" "${{ inputs.sha }}"
        "${{ inputs.service }}" "${{ inputs.destination }}"
