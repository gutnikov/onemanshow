name: verify layers
description: >
  Checks that destination-labelled derivatives are the artifact that was built.
  This is the promotion invariant: it cannot be a digest comparison, because a
  derivative must differ in metadata, so it compares the layers that actually run.
inputs:
  image: { description: Registry path, required: true }
  base: { description: Tag of the built image, required: true }
  tags: { description: Space-separated derivative tags to check, required: true }
runs:
  using: composite
  steps:
    - shell: sh
      env:
        IMAGE: ${{ inputs.image }}
        BASE: ${{ inputs.base }}
        TAGS: ${{ inputs.tags }}
        ACTION_PATH: ${{ github.action_path }}
      # TAGS is unquoted so the list splits into arguments; as a variable it
      # cannot introduce command substitution.
      run: '"$ACTION_PATH/verify-layers" "$IMAGE" "$BASE" $TAGS'
