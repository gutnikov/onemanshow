name: merge change
description: >
  Fast-forwards main to the validated commit. Only a fast-forward: any other
  merge produces a commit that was never built, leaving nothing to promote
  without rebuilding, and a rebuilt image is not the artifact that passed.
inputs:
  ticket:
    description: Ticket number of the change being merged
    required: true
  head:
    description: >
      The commit that would become main's head, resolved once by pr-head.
      Resolved here as well, it became a second lookup with a second failure
      mode - which failed a repeated approval after all six guards had passed.
    required: true
  release_workflow:
    description: >
      Filename of the instance workflow that releases. Dispatched after the
      merge, because a push made with the workflow token raises no events.
    required: false
    default: on-main.yml
  token:
    description: Token able to push to main, dispatch workflows and comment on issues
    required: true
outputs:
  head:
    description: The commit that became main's head
    value: ${{ steps.merge.outputs.head }}
runs:
  using: composite
  steps:
    - id: merge
      shell: sh
      env:
        GH_TOKEN: ${{ inputs.token }}
        RELEASE_WORKFLOW: ${{ inputs.release_workflow }}
        TICKET: ${{ inputs.ticket }}
        HEAD: ${{ inputs.head }}
        ACTION_PATH: ${{ github.action_path }}
      run: '"$ACTION_PATH/merge-change" "$TICKET" "$HEAD"'
