name: merge guards
description: >
  Reads the six conditions that must hold before a change is merged, and
  reports each one by name. None of them was enforced by anything before this
  existed - they held for as long as whoever merged read them.
inputs:
  ticket:
    description: Ticket number of the change being merged
    required: true
  sha:
    description: The commit that would become main's head
    required: true
  production_health_url:
    description: >
      Production's health endpoint, which reports the commit it is running.
      Asked directly because a deploy log records intent, and a rollback is
      when intent and reality differ.
    required: true
  release_workflow:
    description: >
      Path to the workflow whose trigger defines which paths are deployable.
      Read rather than copied so the guard and the trigger cannot disagree.
    required: false
    default: .github/workflows/on-main.yml
  token:
    description: Token able to read issues, timelines and commit statuses
    required: true
runs:
  using: composite
  steps:
    - shell: sh
      env:
        GH_TOKEN: ${{ inputs.token }}
        PRODUCTION_HEALTH_URL: ${{ inputs.production_health_url }}
        RELEASE_WORKFLOW: ${{ inputs.release_workflow }}
        TICKET: ${{ inputs.ticket }}
        SHA: ${{ inputs.sha }}
        ACTION_DIR: ${{ github.action_path }}
      run: '"$ACTION_DIR/merge-guards" "$TICKET" "$SHA"'
