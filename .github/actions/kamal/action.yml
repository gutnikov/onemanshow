name: kamal
description: >
  Runs Kamal from its published container image, so no Ruby is needed on the
  runner and the version is pinned rather than whatever :latest happens to be.
inputs:
  args:
    description: Arguments passed to kamal, for example "deploy --skip-push --version x -d staging"
    required: true
  capture:
    description: >
      Return what Kamal printed as an output, for the callers that ask a question
      rather than give a command - `app version` is a question. Off by default,
      because capturing means the output arrives at the end instead of streaming,
      and a deploy that takes minutes should be watchable while it runs.
    required: false
    default: 'false'
outputs:
  out:
    description: What Kamal printed, when capture was asked for. Empty otherwise.
    value: ${{ steps.run.outputs.out }}
runs:
  using: composite
  steps:
    # Inputs travel through env, never through ${{ }} inside the script: an
    # interpolated input becomes part of the script text, so anything able to
    # influence it could run commands as this job.
    #
    # The list of secrets to forward is derived from .kamal/secrets rather than
    # written here. It used to be a hand-kept list, and a secret missing from it
    # was resolved as an empty value rather than an error - so error reporting
    # was silently off in production while every file said it was configured.
    # One declaration is enough now.
    - id: run
      shell: sh
      env:
        ARGS: ${{ inputs.args }}
        CAPTURE: ${{ inputs.capture }}
      run: |
        set -eu
        forward=""
        for f in .kamal/secrets-common .kamal/secrets; do
          [ -f "$f" ] || continue
          names="$(sed -n 's/^\([A-Z_][A-Z0-9_]*\)=.*/\1/p' "$f")"
          for n in $names; do
            case " $forward " in *" -e $n "*) continue ;; esac
            forward="$forward -e $n"
          done
        done
        echo "forwarding to kamal:$forward"

        # Any secret named in the file must actually have a value, or Kamal
        # writes an empty one and everything downstream looks configured.
        missing=""
        for n in $(printf '%s' "$forward" | tr ' ' '\n' | grep -v '^-e$' | grep -v '^$'); do
          eval "v=\${$n:-}"
          [ -n "$v" ] || missing="$missing $n"
        done
        if [ -n "$missing" ]; then
          echo "::error::These secrets are declared for the deploy tool but empty in this job:$missing"
          exit 1
        fi

        run_kamal() {
          docker run --rm \
            -v "$PWD:/workdir" \
            -v "$HOME/.ssh:/root/.ssh:ro" \
            -e SHIP_IMAGE -e SHIP_HOST -e SHIP_DOMAIN -e SHIP_STAGING_DOMAIN \
            -e SHIP_REGISTRY_USER -e SHIP_REGISTRY_SERVER -e SHIP_BREAK_GREETING \
            $forward \
            ghcr.io/basecamp/kamal:v2.12.0 $ARGS
        }

        if [ "${CAPTURE:-false}" != "true" ]; then
          run_kamal
        else
          # Captured, then printed, so the log still holds it. The status is the
          # command's own: read from the command, not from the end of a pipeline,
          # which is a mistake this project has made three times.
          if out="$(run_kamal 2>&1)"; then status=0; else status=$?; fi
          printf '%s\n' "$out"
          {
            echo 'out<<KAMAL_OUTPUT_EOF'
            printf '%s\n' "$out"
            echo 'KAMAL_OUTPUT_EOF'
          } >> "$GITHUB_OUTPUT"
          exit "$status"
        fi
