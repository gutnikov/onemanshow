name: rollback
description: >
  Returns production one step and refuses to go further. Shared by the release
  workflow, which uses it when smoke fails, and by the manual rollback workflow -
  the refusals are the substance here and must not exist in two copies.
inputs:
  url: { description: Address of production, required: true }
  service: { description: Service name of the production destination, required: true }
outputs:
  rewound:
    description: >
      Whether the image was actually rewound. Read rather than inferred: a
      release that failed is not the same as a production that moved, and the
      message a person reads afterwards has to know the difference.
    value: ${{ steps.rewind.outputs.rewound }}
runs:
  using: composite
  steps:
    # Refusing a rollback of a rollback needs no stored flag: production equals
    # the last deployable commit when nothing is unresolved, so production being
    # behind it IS the record that one is already in effect. Automation does not
    # fix its own fix.
    #
    # The last deployable commit, not main's tip. Those differ whenever main
    # carries something that must not release - an archive commit, a change to
    # the pipeline's own wiring - and merge guard 4 has always compared against
    # the deployable one. This compared against the tip, so after any such commit
    # a rollback refused with "production is already behind main" when production
    # was exactly where it belonged. Two copies of "what production should equal",
    # disagreeing; the list now comes from the same script the guard uses.
    - shell: sh
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -u
        if ! out="$(docker run --rm -v "$PWD:/workdir" -v "$HOME/.ssh:/root/.ssh:ro" \
                     -e SHIP_IMAGE -e SHIP_HOST -e SHIP_DOMAIN -e SHIP_REGISTRY_USER -e SHIP_REGISTRY_SERVER \
                     -e KAMAL_REGISTRY_PASSWORD -e DATABASE_URL -e POSTGRES_PASSWORD \
                     ghcr.io/basecamp/kamal:v2.12.0 app version 2>&1)"; then
          echo "could not read the deployed version:" >&2
          printf '%s\n' "$out" >&2
          exit 1
        fi
        deployed="$(printf '%s\n' "$out" | grep -oE '^[0-9a-f]{40}' | tail -1 || true)"
        IGNORE="$("${ACTION_PATH}/../merge-guards/deployable-excludes.py" \
                   "${RELEASE_WORKFLOW_FILE:-.github/workflows/on-main.yml}")"
        # shellcheck disable=SC2086
        expected="$(git log -1 --format=%H origin/main -- . $IGNORE)"
        echo "deployed=$deployed last-deployable=$expected"
        if [ -z "$deployed" ]; then
          echo "refusing: cannot tell what production is running" >&2
          exit 1
        fi
        if [ "$deployed" != "$expected" ]; then
          echo "::error::Production runs ${deployed} and the last deployable commit is ${expected}," \
               "so a rollback is already unresolved. This needs a person: rolling back again only" \
               "moves further from where production belongs."
          exit 1
        fi
        # Actions runs sh with -e, and a script whose last executed command is a
        # false test exits non-zero. Ending on an explicit success keeps a passing
        # guard from reading as a failure.
        echo "nothing unresolved; proceeding with one step back"
        exit 0

    # kamal rollback needs the version to go back to; it does not work out the
    # previous one itself. The machine knows: the previous release's container is
    # still there, stopped, and its name carries the version.
    - id: previous
      shell: sh
      env:
        HOST: ${{ env.SHIP_HOST }}
        SERVICE: ${{ inputs.service }}
      run: |
        set -eu
        versions="$(ssh "root@$HOST" \
          "docker ps -a --filter label=service=$SERVICE --filter label=role=web \
             --format '{{.CreatedAt}}|{{.Names}}' | sort -r | sed 's|.*|&|'")"
        echo "containers on the machine:"
        printf '%s\n' "$versions" | sed 's/^/  /'
        prev="$(printf '%s\n' "$versions" | sed -n "2p" | sed "s|.*|&|" \
                 | cut -d'|' -f2 | sed "s|^${SERVICE}-web-||")"
        if [ -z "$prev" ]; then
          echo "::error::No previous version exists on the machine, so there is nothing to roll back to."
          exit 1
        fi
        echo "prev=$prev" >> "$GITHUB_OUTPUT"
        echo "rolling back to $prev"

    # A rollback pulls, and nothing on this path logs in. The deploy path logs in
    # as a side effect of pushing; a rollback only boots, so it has been relying
    # on a login left in the host's docker config by the last deploy. That is a
    # file nobody declares and nothing checks - and the moment it is missing is
    # an incident, which is the worst moment to discover it.
    - uses: gutnikov/onemanshow/.github/actions/kamal@main
      with: { args: "registry login" }

    # Through the shared action, not a hand-rolled docker run. That action
    # derives what to forward from the deploy tool's own secrets file and refuses
    # a name that is declared but empty - which is exactly the check this path
    # lacked when it could not boot the application.
    - uses: gutnikov/onemanshow/.github/actions/kamal@main
      with: { args: "rollback ${{ steps.previous.outputs.prev }}" }

    - id: rewind
      shell: sh
      env:
        PREV: ${{ steps.previous.outputs.prev }}
      run: |

        # Then ask production what it runs, because the command's exit code does
        # not answer it. `kamal rollback` prints "the app version is not
        # available as a container" in red and **returns normally** when the
        # target container has been pruned - it retains five - so a successful
        # command is compatible with nothing having moved. Reporting rewound on
        # exit 0 is how a release tells a person production was returned while
        # it still runs the broken image.
        #
        # This is the same lesson as the guard above it: ask the artifact, not
        # the log of what was intended.
        now="$(docker run --rm -v "$PWD:/workdir" -v "$HOME/.ssh:/root/.ssh:ro" \
                 -e SHIP_IMAGE -e SHIP_HOST -e SHIP_DOMAIN -e SHIP_REGISTRY_USER -e SHIP_REGISTRY_SERVER \
                 -e KAMAL_REGISTRY_PASSWORD -e DATABASE_URL -e POSTGRES_PASSWORD \
                 ghcr.io/basecamp/kamal:v2.12.0 app version 2>&1 \
               | grep -oE '^[0-9a-f]{40}' | tail -1 || true)"
        if [ "$now" = "$PREV" ]; then
          echo 'rewound=yes' >> "$GITHUB_OUTPUT"
          echo "production now runs ${now}, which is what it was asked to return to"
        else
          echo 'rewound=no' >> "$GITHUB_OUTPUT"
          echo "::error::The rollback command succeeded and production runs ${now:-nothing it would say}," \
               "not ${PREV}. The target container is most likely pruned - kamal retains five - and" \
               "kamal exits 0 when it cannot find it. Production has NOT been returned; a person must decide."
          exit 1
        fi

    # The cascade guard. If the previous version fails too, the cause is not the
    # image - most likely a migration already applied that older code cannot work
    # against - and stepping further back never terminates.
    - id: verify
      shell: sh
      continue-on-error: true
      env:
        SHIP_URL: ${{ inputs.url }}
      run: ./ship/smoke

    - shell: sh
      if: steps.verify.outcome == 'failure'
      run: |
        echo "::error::The rolled-back version also fails verification." \
             "No further rollback will be attempted: stepping back cannot help" \
             "when the schema has moved. A person must decide."
        exit 1
