# Moves an environment's data from a database on the machine to a managed one.
#
# One-off by nature and kept anyway: a project doing this a year from now will
# want the steps to exist rather than to be reconstructed, and the check at the
# end is the part that is easy to leave out.
#
# It does not change any configuration. Copying the data and pointing the
# application at it are separate acts, so the copy can be verified before
# anything depends on it, and so a failed copy leaves production untouched.
name: adopt database

on:
  workflow_call:
    inputs:
      host: { required: true, type: string }
      host_key: { required: false, type: string, default: "" }
      known_row_query:
        description: SQL returning one value that must survive the move
        required: false
        type: string
        default: "select message from greeting limit 1"
    secrets:
      SOPS_AGE_KEY: { required: true }
      SSH_PRIVATE_KEY: { required: true }

jobs:
  adopt:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: install sops
        run: |
          curl -fsSL -o /tmp/sops https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
      - uses: gutnikov/onemanshow/.github/actions/ssh-agentless@main
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          host: ${{ inputs.host }}
          host_key: ${{ inputs.host_key }}

      - name: read both addresses
        run: |
          set -eu
          # Both addresses are read the same way, because both can be absent for
          # the same ordinary reason: an operator running this before setting
          # them. This one used to fail inside sops with nothing a reader could
          # act on, eight lines above a neighbour that got it right.
          #
          # DATABASE_URL_TUNNEL is deliberately not in the example files. It
          # exists only while a project still has a database on its machine, and
          # a name in an example is a name every new project copies - the example
          # describes the steady state, and this workflow says what to add for
          # the move.
          if ! old="$(sops -d --extract '["DATABASE_URL_TUNNEL"]' secrets/prod.yaml 2>/dev/null)"; then
            echo "::error::set DATABASE_URL_TUNNEL in secrets/prod.yaml to the address of the database still on the machine, reached through the CI tunnel. This workflow moves data off that database; without the address there is nothing to move from. If this project never had one, it has nothing to adopt."
            exit 1
          fi
          echo "::add-mask::$old"
          echo "OLD_URL=$old" >> "$GITHUB_ENV"
          # The destination is read from a secret the operator sets before
          # running this, not fetched with a provider key. Fetching it would
          # require a key that can see the production project, and the key this
          # pipeline holds permanently is deliberately scoped to staging - so a
          # one-off would have forced a permanent widening.
          if ! new="$(sops -d --extract '["DATABASE_URL_NEW"]' secrets/prod.yaml 2>/dev/null)"; then
            echo "::error::set DATABASE_URL_NEW in secrets/prod.yaml to the managed database's connection string before running this. It is deliberately not fetched with a provider key: doing so would need a key able to see production, and the permanent one is scoped to staging."
            exit 1
          fi
          echo "::add-mask::$new"
          echo "NEW_URL=$new" >> "$GITHUB_ENV"

      # Every client runs in a container, at a version at least as new as both
      # servers. The runner's own pg_dump is older than the database on the
      # machine and refuses to dump it - "aborting because of server version
      # mismatch". backup.yml already knew this and did it in a container; this
      # workflow was written beside it without reusing the lesson.
      - name: the destination must be empty
        run: |
          set -eu
          n="$(docker run --rm --network host -e U="$NEW_URL" postgres:18-alpine \
                 sh -c 'psql "$U" -tAc "select count(*) from information_schema.tables where table_schema='"'"'public'"'"'"' \
               | tr -d '[:space:]')"
          [ "$n" = 0 ] || { echo "::error::the managed database already holds ${n} table(s); refusing to copy into it"; exit 1; }
          echo "destination is empty"

      - name: copy
        run: |
          set -eu
          ssh -f -N -L 5432:localhost:5432 "root@${{ inputs.host }}"
          docker run --rm --network host -e U="$OLD_URL" postgres:18-alpine \
            sh -c 'pg_dump --no-owner --no-privileges --clean --if-exists "$U"' > /tmp/move.sql
          echo "dumped $(wc -c < /tmp/move.sql) bytes"
          [ -s /tmp/move.sql ] || { echo "::error::the dump is empty"; exit 1; }
          docker run --rm --network host -i -e U="$NEW_URL" postgres:18-alpine \
            sh -c 'psql "$U" -v ON_ERROR_STOP=1 -q -f -' < /tmp/move.sql
          echo "restored"

      # Read back a value that had to survive. A copy that reports success and
      # moved nothing is the failure this whole project keeps finding.
      - name: read back what had to survive
        run: |
          set -eu
          ask() {
            docker run --rm --network host -e U="$1" -e Q="${{ inputs.known_row_query }}" \
              postgres:18-alpine sh -c 'psql "$U" -tAc "$Q"' | sed 's/^ *//;s/ *$//'
          }
          before="$(ask "$OLD_URL")"
          after="$(ask "$NEW_URL")"
          echo "old: '${before}'"
          echo "new: '${after}'"
          [ -n "$after" ] || { echo "::error::the destination returned nothing for the known row"; exit 1; }
          [ "$before" = "$after" ] || { echo "::error::the value differs after the copy"; exit 1; }
          echo "the value survived the move"

      - name: what this did not do
        run: |
          echo "The data is copied and verified. Nothing points at it yet:"
          echo "  change DATABASE_URL in secrets/prod.yaml and push, which"
          echo "  redeploys the running version with the new configuration."
          echo "The old database is untouched, so this is reversible until it is deleted."
