# A backup that has never been restored is not a backup, so this workflow
# restores every dump it takes - into a scratch database, then reads a known row
# back out. A dump that cannot be restored fails the run loudly, which is the
# only way a backup stops rotting unnoticed.
#
# It runs off the machine on purpose. A cron on the box fails into the void; a
# scheduled workflow that stops working is visible.
#
# It no longer reaches the machine at all: the database is managed, so there is
# no tunnel, no ssh key, and no host to name. The address the application uses is
# the address this dumps - one value rather than two that have to agree.
name: backup

on:
  workflow_call:
    inputs:
      keep:
        description: >
          How many encrypted dumps to keep on the machine. Enforced before
          writing, not after: a moment where the limit is exceeded is a moment
          where a small disk can fill, and a backup that fills a disk causes the
          outage it exists to survive.
        required: false
        type: number
        default: 14
      host:
        description: The machine the dumps are kept on. Not where the database is.
        required: true
        type: string
      host_key: { required: false, type: string, default: "" }
      known_row_query:
        description: SQL returning one known value from a restored dump, used to prove the restore worked
        required: false
        type: string
        default: "select count(*)::text from greeting"
    secrets:
      SOPS_AGE_KEY: { required: true }
      SSH_PRIVATE_KEY: { required: true }

jobs:
  dump:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    services:
      scratch:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: scratch
          POSTGRES_PASSWORD: scratch
          POSTGRES_DB: scratch
        ports: ['5544:5432']
        options: >-
          --health-cmd "pg_isready -U scratch" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: install sops and age
        run: |
          curl -fsSL -o /tmp/sops https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          curl -fsSL https://github.com/FiloSottile/age/releases/download/v1.2.1/age-v1.2.1-linux-amd64.tar.gz \
            | tar -xz -C /tmp
          sudo install -m 0755 /tmp/age/age /usr/local/bin/age


      - name: read production credentials
        run: |
          set -eu
          v="$(sops -d --extract '["DATABASE_URL"]' secrets/prod.yaml)"
          echo "::add-mask::$v"
          echo "DATABASE_URL=$v" >> "$GITHUB_ENV"

      - name: dump production
        run: |
          set -eu
          # The client comes from the same image as the server, so the versions
          # match by construction. A distribution's postgresql-client trails the
          # server and pg_dump refuses to dump a newer one at all.
          docker run --rm --network host -e PGURL="$DATABASE_URL" \
            postgres:18-alpine \
            sh -c 'pg_dump --no-owner --no-privileges --format=plain "$PGURL"' > /tmp/backup.sql
          bytes="$(wc -c < /tmp/backup.sql)"
          echo "dump is $bytes bytes"
          # An empty or trivially small dump is the usual way this fails
          # silently: the command succeeds and produces nothing useful.
          if [ "$bytes" -lt 200 ]; then
            echo "::error::The dump is $bytes bytes, which cannot be a real database."
            exit 1
          fi

      # The query travels as an environment variable. Interpolating an input
      # into the script makes it part of the script, so a caller could run
      # commands as this job - the same mistake the composite actions were
      # fixed for, made again here.
      - name: restore it into a scratch database and read a known row
        env:
          SCRATCH: postgres://scratch:scratch@localhost:5544/scratch
          KNOWN_ROW_QUERY: ${{ inputs.known_row_query }}
        run: |
          set -eu
          docker run --rm --network host -e PGURL="$SCRATCH" -v /tmp/backup.sql:/backup.sql:ro \
            postgres:18-alpine sh -c 'psql -q -f /backup.sql "$PGURL"'
          value="$(docker run --rm --network host -e PGURL="$SCRATCH" -e Q="$KNOWN_ROW_QUERY" \
            postgres:18-alpine sh -c 'psql -t -A -c "$Q" "$PGURL"')"
          echo "known row reads back as: $value"
          if [ -z "$value" ]; then
            echo "::error::The dump restored but the known row is missing, so the backup is not usable."
            exit 1
          fi

      # A dump is the whole production database, and an artifact can be
      # downloaded by anyone who can read the repository. It leaves the runner
      # encrypted to the same age recipient that already guards this
      # environment's secrets; the key is not in the repository, so the artifact
      # is useless on its own.
      - name: encrypt the dump before it leaves the runner
        run: |
          set -eu
          recipient="$(grep -A1 'secrets/prod' .sops.yaml | sed -n 's/.*age: *//p' | head -1)"
          case "$recipient" in
            age1*) ;;
            *) echo "::error::No age recipient for production found in .sops.yaml"; exit 1 ;;
          esac
          age -r "$recipient" -o /tmp/backup.sql.age /tmp/backup.sql
          rm -f /tmp/backup.sql
          echo "encrypted to ${recipient} ($(wc -c < /tmp/backup.sql.age) bytes)"
          # A step that reports success without producing ciphertext is the
          # failure this whole workflow is built to avoid, so it is checked.
          if grep -qa 'CREATE TABLE' /tmp/backup.sql.age; then
            echo "::error::The artifact still contains plaintext SQL."
            exit 1
          fi

      # ssh comes back here, for a different reason than it left. It is not how
      # the database is reached any more - that is a network address - it is how
      # the storage is reached.
      - uses: gutnikov/onemanshow/.github/actions/ssh-agentless@main
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          host: ${{ inputs.host }}
          host_key: ${{ inputs.host_key }}

      # The machine, which after the database moved has nothing to do with it.
      # So a dump here survives losing the code host and losing the database
      # provider - the two losses that matter. It does not survive losing this
      # machine, and destroying the data then needs two unrelated providers to
      # fail at once, against a host that is the cheap thing to rebuild.
      #
      # Pruned before writing. Doing it afterwards leaves a moment where the
      # limit is exceeded, and on a small disk that moment is the outage.
      - name: keep it on the machine, and only the last few
        env:
          KEEP: ${{ inputs.keep }}
          HOST: ${{ inputs.host }}
        run: |
          set -eu
          dir=/var/backups/onemanshow
          ssh "root@$HOST" "mkdir -p $dir && chmod 700 $dir"
          # Prune to KEEP-1 so that this run's file lands inside the limit.
          ssh "root@$HOST" "ls -1t ${dir}/*.sql.age 2>/dev/null | tail -n +${KEEP} | xargs -r rm -f --" || true
          name="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA:-manual}.sql.age"
          scp -q /tmp/backup.sql.age "root@$HOST:${dir}/${name}"

          # Checked on the machine, by content. A step that reports success is
          # not evidence it produced anything, and this project has already
          # produced a dump it wrongly believed was encrypted.
          head="$(ssh "root@$HOST" "head -c 22 ${dir}/${name}")"
          case "$head" in
            "age-encryption.org"*) echo "arrived encrypted: ${name}" ;;
            *) echo "::error::the file on the machine does not begin like an age file; refusing to call this a backup"; exit 1 ;;
          esac
          size="$(ssh "root@$HOST" "wc -c < ${dir}/${name}" | tr -d '[:space:]')"
          [ "$size" -gt 500 ] || { echo "::error::the file on the machine is ${size} bytes"; exit 1; }

          # Said on every run, including the quiet ones. A backup that has
          # silently stopped is indistinguishable from one that is working.
          echo "kept ${size} bytes; the machine now holds:"
          ssh "root@$HOST" "ls -1t ${dir} | head -n 20 | sed 's/^/  /'"
          held="$(ssh "root@$HOST" "ls -1 ${dir}/*.sql.age 2>/dev/null | wc -l" | tr -d '[:space:]')"
          echo "${held} dump(s) held, limit ${KEEP}"
          [ "$held" -le "$KEEP" ] || { echo "::error::${held} dumps exceed the limit of ${KEEP}"; exit 1; }
          ssh "root@$HOST" "df -h ${dir} | tail -1 | sed 's/^/  disk: /'"

      # Kept for convenience, and labelled so nobody mistakes it for the backup.
      - name: a copy for reading, which is not the backup
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: /tmp/backup.sql.age
          retention-days: 7

      - name: which loss each mechanism covers
        run: |
          echo "The dump on the machine survives losing this code host and"
          echo "losing the database provider. It does not survive losing the"
          echo "machine's provider."
          echo "The provider's point-in-time recovery covers the wrong statement"
          echo "having run, at whatever retention the plan gives - check it and"
          echo "write it down next to this limit, because neither number means"
          echo "anything about the other."
          echo "The artifact above is a convenience for reading a dump. It lives"
          echo "in this account and is not the backup."
