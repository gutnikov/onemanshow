# Pull request validation. Reusable: a project's stub calls this so that
# improvements here reach it without an edit there.
#
# The order is the point. Checking precedes building, in one job, so a failing
# check cannot produce an image - the cheapest verification fails first, and no
# artifact exists to be promoted by mistake.
name: pr

on:
  workflow_call:
    inputs:
      image:
        description: Registry path of the single image this project produces
        required: true
        type: string
    secrets:
      registry_user:
        required: true
      registry_token:
        required: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: check
        run: .github/scripts/hook check

      - name: log in to the registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.registry_user }}
          password: ${{ secrets.registry_token }}

      - name: build
        env:
          SHIP_IMAGE: ${{ inputs.image }}
          SHIP_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/hook build

      # Only the commit SHA. No floating tag is ever created: with one you
      # cannot verify what is running, and the promotion invariant becomes
      # unprovable.
      - name: push the one artifact
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: docker push "${{ inputs.image }}:${SHA}"
