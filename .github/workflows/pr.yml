# Pull request validation, and the only place the write credential is used.
#
# Checking precedes building, in one job, so a failing check cannot produce an
# image. The destination-labelled derivatives are published here too, rather
# than at deploy time, so that the credential able to write to the registry
# stays confined to this workflow - the machine only ever pulls.
name: pr

on:
  workflow_call:
    inputs:
      image:
        description: Repository path WITHOUT the registry host, which the deploy tool prepends from its own config
        required: true
        type: string
      service: { description: Service name of the production destination, required: true, type: string }
      staging_service: { required: true, type: string }
      staging_workflow:
        description: Filename of the instance workflow that runs the staging validation, dispatched once checks and the build pass.
        required: false
        type: string
        default: on-staging.yml
      registry:
        description: >
          Registry host, e.g. ghcr.io. Required rather than defaulted so a stub
          that forgets it is caught by the stub checker instead of resolving to
          Docker Hub in one code path and the configured host in another.
        required: true
        type: string
      registry_user: { description: Registry account name (not a secret), required: true, type: string }
    secrets:
      # Named to match what a project actually holds, so a stub can use
      # "secrets: inherit" and stay short.
      SOPS_AGE_KEY: { required: true }

jobs:
  validate:
    runs-on: ubuntu-latest
    # Declared explicitly, not inherited. The repository's ceiling has to allow
    # write for the promote job below to request it at all, and a job that says
    # nothing then receives write it has no use for.
    permissions: { contents: read, packages: write }
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # Full history: the ancestry check below cannot be answered by a shallow
      # clone, and answering it wrongly would be worse than not asking.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # The commit under review, published so the next job promotes the thing
      # that was validated rather than whatever the branch points at by then.
      - id: commit
        run: echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # Asked here rather than only at the merge. The merge takes fast-forwards
      # only - the artifact exists for the validated commit and no other - so a
      # head that main is not an ancestor of cannot be merged whatever the tests
      # say. Learning that after a full staging run costs the run, the stand and
      # somebody's attention, and it cost exactly that once: a branch cut from a
      # stale local main validated a tree that was missing another change's
      # work, and the eleven tests that passed were the wrong eleven.
      - name: main must be an ancestor of this head
        run: |
          set -eu
          git fetch -q origin main
          if git merge-base --is-ancestor origin/main "$SHA"; then
            echo "main is an ancestor of ${SHA} - a fast-forward is possible"
          else
            echo "::error::main is not an ancestor of ${SHA}: either it moved on," \
                 "or this branch was cut from an older main. Validating it would prove" \
                 "something about a tree that cannot be merged. Rebase onto main and push again."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund

      - name: check
        uses: gutnikov/onemanshow/.github/actions/run-hook@main
        with: { name: check }

      - name: install sops
        run: |
          curl -fsSL -o /tmp/sops https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops

      - uses: docker/setup-buildx-action@v3

      # The run's own token, not a stored credential. A reusable workflow mints
      # the caller's token, so this is the instance repository's, and the job
      # above declares the write it needs. That is why REGISTRY_TOKEN_RW no
      # longer exists: it was a credential whose only job was to be rotated.
      #
      # The instance's workflow permission ceiling has to allow write for the
      # declaration to be granted - init.md says so, because a repository
      # defaulted to read would fail here at push time.
      - name: log in to the registry
        run: |
          printf '%s' '${{ github.token }}' \
            | docker login '${{ inputs.registry }}' -u '${{ github.actor }}' --password-stdin

      # The machine is x86_64; runners are too, but the platform is pinned so a
      # build from an arm workstation produces the same thing.
      - name: build once
        run: |
          docker buildx build --platform linux/amd64 \
            -t "${{ inputs.registry }}/${{ inputs.image }}:${SHA}" --push .

      - name: label for production
        uses: gutnikov/onemanshow/.github/actions/label-image@main
        with:
          image: ${{ inputs.registry }}/${{ inputs.image }}
          sha: ${{ env.SHA }}
          service: ${{ inputs.service }}
          destination: production

      - name: label for staging
        uses: gutnikov/onemanshow/.github/actions/label-image@main
        with:
          image: ${{ inputs.registry }}/${{ inputs.image }}
          sha: ${{ env.SHA }}
          service: ${{ inputs.staging_service }}
          destination: staging

      - name: the derivatives must be the artifact that was built
        uses: gutnikov/onemanshow/.github/actions/verify-layers@main
        with:
          image: ${{ inputs.registry }}/${{ inputs.image }}
          base: ${{ env.SHA }}
          tags: ${{ env.SHA }}-production ${{ env.SHA }}-staging

  # dev -> staging. The lifecycle assigns this to automation, and until now a
  # person carried it: they read a green run and then asked for the next step.
  promote:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - id: ticket
        uses: gutnikov/onemanshow/.github/actions/ticket-status@main
        with:
          # The fallback is not cosmetic. Without it this workflow cannot be
          # run by hand, and running it by hand is the only way the pipeline
          # moves when the code host stalls pull_request events - which it did,
          # for forty minutes, on 2026-08-26. The commit one screen up already
          # had this fallback; the branch did not, which is the same fact
          # written twice with different care.
          branch: "${{ github.event.pull_request.head.ref || github.ref_name }}"
          token: ${{ github.token }}
      # Read from the project's own file, so the ceiling exists in one place.
      - id: limits
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          c = yaml.safe_load(open("ship.yml"))
          print(f"budget={(c.get('limits') or {}).get('automatic_actions_per_change', 20)}")
          PY
      # Before the action, not after. A ceiling checked afterwards has already
      # let the action through, which is the one thing it exists to prevent.
      - uses: gutnikov/onemanshow/.github/actions/budget@main
        with:
          ticket: ${{ steps.ticket.outputs.ticket }}
          limit: ${{ steps.limits.outputs.budget }}
          token: ${{ github.token }}
      - uses: gutnikov/onemanshow/.github/actions/promote-to-staging@main
        with:
          ticket: ${{ steps.ticket.outputs.ticket }}
          status: ${{ steps.ticket.outputs.status }}
          sha: ${{ needs.validate.outputs.sha }}
          staging_workflow: ${{ inputs.staging_workflow }}
          token: ${{ github.token }}
