# Production release by promotion.
#
# The image is pulled, never rebuilt: builds are not bit-reproducible, so a
# rebuilt image is not the artifact that passed validation, and the invariant
# would be quietly false rather than loudly broken. If smoke fails afterwards the
# release rolls itself back, once, and says so.
name: release

on:
  workflow_call:
    inputs:
      image:
        description: Repository path WITHOUT the registry host, which the deploy tool prepends from its own config
        required: true
        type: string
      sha: { required: true, type: string }
      registry_user: { required: true, type: string }
      host: { required: true, type: string }
      domain: { description: Production host name, required: true, type: string }
      service: { description: Service name of the production destination, required: true, type: string }
      host_key:
        description: known_hosts line(s) for the machine, from ssh-keyscan. Not a secret.
        required: false
        type: string
        default: ""
    secrets:
      SOPS_AGE_KEY: { required: true }
      SSH_PRIVATE_KEY: { required: true }

jobs:
  release:
    runs-on: ubuntu-latest
    # Declared, not inherited: the repository's ceiling is write so that the
    # reactive layer can move labels, and a job that says nothing receives it.
    permissions: { contents: read, issues: write, pull-requests: read }
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      SHIP_IMAGE: ${{ inputs.image }}
      SHIP_HOST: ${{ inputs.host }}
      SHIP_DOMAIN: ${{ inputs.domain }}
      SHIP_REGISTRY_USER: ${{ inputs.registry_user }}
    steps:
      # Pinned rather than left to default. Triggered from a push to main the
      # default already resolves here, so this changes nothing today - it stops
      # the correctness from depending on which event happened to start the run,
      # which is how the same omission in staging.yml went unnoticed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund

      - name: install sops
        run: |
          curl -fsSL -o /tmp/sops https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops

      - uses: gutnikov/onemanshow/.github/actions/ssh-agentless@main
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          host: ${{ inputs.host }}
          host_key: ${{ inputs.host_key }}

      # Values decrypted here are not masked by Actions, which masks only what
      # came from secrets.*, so each is registered before export.
      - name: read production credentials
        run: |
          set -eu
          read_secret() {
            v="$(sops -d --extract "[\"$1\"]" "secrets/prod.yaml")"
            echo "::add-mask::$v"
            echo "$2=$v" >> "$GITHUB_ENV"
          }
          read_secret REGISTRY_TOKEN_RO KAMAL_REGISTRY_PASSWORD
          read_secret DATABASE_URL DATABASE_URL
          read_secret POSTGRES_PASSWORD POSTGRES_PASSWORD
          read_secret DATABASE_URL_TUNNEL DATABASE_URL_TUNNEL
          read_secret SENTRY_DSN SENTRY_DSN

      # Fail rather than rebuild: recovering by rebuilding would deploy an
      # artifact nobody verified.
      - name: the validated artifact must exist
        run: |
          set -eu
          sops -d --extract '["REGISTRY_TOKEN_RO"]' secrets/prod.yaml \
            | docker login -u '${{ inputs.registry_user }}' --password-stdin
          docker buildx imagetools inspect \
            "${{ inputs.image }}:${{ inputs.sha }}-production" > /dev/null
          echo "promoting ${{ inputs.sha }}-production"

      # Read before anything changes. After the deploy this answers about the
      # new image, and the question is what production was running BEFORE - the
      # image an automatic rollback would return to.
      - id: before
        continue-on-error: true
        run: |
          set -eu
          v="$(.github/actions/production-commit/production-commit \
                 "https://${{ inputs.domain }}/health" || true)"
          echo "sha=$v" >> "$GITHUB_OUTPUT"
          echo "production was running: ${v:-unknown}"

      - name: migrate production
        run: |
          ssh -f -N -L 5432:localhost:5432 "root@${{ inputs.host }}"
          DATABASE_URL="$DATABASE_URL_TUNNEL" ./ship/migrate

      - name: deploy
        uses: gutnikov/onemanshow/.github/actions/kamal@main
        with: { args: "deploy --skip-push --version ${{ inputs.sha }}-production" }

      - name: smoke
        id: smoke
        continue-on-error: true
        env: { SHIP_URL: "https://${{ inputs.domain }}" }
        uses: gutnikov/onemanshow/.github/actions/run-hook@main
        with: { name: smoke }

      # Whether rewinding the image is a recovery or a second failure.
      #
      # Migrations run before the deploy, so after a release that added one the
      # schema has already moved. Rewinding the image then leaves old code
      # against a newer schema, which readiness reports as schema-ahead and
      # refuses to call healthy - the rollback fails its own health check and
      # production ends up broken in a second way rather than restored.
      #
      # So the rollback is automatic exactly where it is safe, and a person is
      # called exactly where it is not. Unknown counts as not safe.
      - id: migrated
        if: steps.smoke.outcome == 'failure'
        uses: gutnikov/onemanshow/.github/actions/migration-in-release@main
        with:
          from: ${{ steps.before.outputs.sha }}
          to: ${{ inputs.sha }}

      - name: roll back, once, if production is not healthy and no schema moved
        if: steps.smoke.outcome == 'failure' && steps.migrated.outputs.migrated == 'no'
        uses: gutnikov/onemanshow/.github/actions/rollback@main
        with:
          url: "https://${{ inputs.domain }}"
          service: ${{ inputs.service }}

      - name: why the rollback was not attempted
        if: steps.smoke.outcome == 'failure' && steps.migrated.outputs.migrated != 'no'
        run: |
          echo "::error::Smoke failed and this release ${{ steps.migrated.outputs.migrated == 'yes' && 'applied a migration' || 'may have applied a migration - it could not be determined' }}." \
               "Rewinding the image would leave the previous code against a schema that has moved on," \
               "which readiness refuses to call healthy - so it would fail its own health check and add" \
               "a second failure rather than restore anything. A person has to decide: forward-fix, or" \
               "roll the schema back too. The change is marked blocked:rollback."

      - name: report the incident
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "::error::Smoke failed after deploying ${{ inputs.sha }}." \
               "Production was rolled back one step. This is an incident, not a retry."
          exit 1

      # The release landing is what opens the observation window, so the
      # transition belongs here. always(): a failed release needs to reach a
      # person more than a successful one does.
      - id: ticket
        if: always()
        uses: gutnikov/onemanshow/.github/actions/ticket-status@main
        with:
          sha: ${{ inputs.sha }}
          token: ${{ github.token }}
      - name: open the observation window
        if: always() && steps.ticket.outputs.ticket != ''
        uses: gutnikov/onemanshow/.github/actions/open-window@main
        with:
          ticket: ${{ steps.ticket.outputs.ticket }}
          sha: ${{ inputs.sha }}
          outcome: ${{ job.status }}
          status: ${{ steps.ticket.outputs.status }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          token: ${{ github.token }}
