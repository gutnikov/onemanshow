# Production release by promotion.
#
# The image is pulled, never rebuilt: builds are not bit-reproducible, so a
# rebuilt image is not the artifact that passed validation, and the invariant
# would be quietly false rather than loudly broken. If smoke fails afterwards the
# release rolls itself back, once, and says so.
name: release

on:
  workflow_call:
    inputs:
      image:
        description: Repository path WITHOUT the registry host, which the deploy tool prepends from its own config
        required: true
        type: string
      sha: { required: true, type: string }
      registry:
        description: >
          Registry host, e.g. ghcr.io. Required rather than defaulted so a stub
          that forgets it is caught by the stub checker instead of resolving to
          Docker Hub in one code path and the configured host in another.
        required: true
        type: string
      registry_user: { required: true, type: string }
      host: { required: true, type: string }
      domain: { description: Production host name, required: true, type: string }
      service: { description: Service name of the production destination, required: true, type: string }
      host_key:
        description: known_hosts line(s) for the machine, from ssh-keyscan. Not a secret.
        required: false
        type: string
        default: ""
    secrets:
      SOPS_AGE_KEY: { required: true }
      SSH_PRIVATE_KEY: { required: true }

jobs:
  release:
    runs-on: ubuntu-latest
    # Declared, not inherited: the repository's ceiling is write so that the
    # reactive layer can move labels, and a job that says nothing receives it.
    permissions: { contents: read, issues: write, pull-requests: read, packages: read }
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      SHIP_IMAGE: ${{ inputs.image }}
      SHIP_HOST: ${{ inputs.host }}
      SHIP_DOMAIN: ${{ inputs.domain }}
      SHIP_REGISTRY_USER: ${{ inputs.registry_user }}
      SHIP_REGISTRY_SERVER: ${{ inputs.registry }}
    steps:
      # Pinned rather than left to default. Triggered from a push to main the
      # default already resolves here, so this changes nothing today - it stops
      # the correctness from depending on which event happened to start the run,
      # which is how the same omission in staging.yml went unnoticed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund

      - name: install sops
        run: |
          curl -fsSL -o /tmp/sops https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops

      - uses: gutnikov/onemanshow/.github/actions/ssh-agentless@main
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          host: ${{ inputs.host }}
          host_key: ${{ inputs.host_key }}

      # Values decrypted here are not masked by Actions, which masks only what
      # came from secrets.*, so each is registered before export.
      - name: read production credentials
        run: |
          set -eu
          read_secret() {
            v="$(sops -d --extract "[\"$1\"]" "$3")"
            echo "::add-mask::$v"
            echo "$2=$v" >> "$GITHUB_ENV"
          }
          # Absent is legitimate here and only here: an application with no
          # accounts has no sign-in check, and the hook's own absence is what
          # reports that. Present-but-wrong is not silent - the check falls back
          # to the fixture account, which production does not have.
          read_optional() {
            v="$(sops -d --extract "[\"$1\"]" "$3" 2>/dev/null || true)"
            if [ -z "$v" ]; then
              echo "no $1 in $3 - the sign-in check will use whatever its hook defaults to"
              return 0
            fi
            echo "::add-mask::$v"
            echo "$2=$v" >> "$GITHUB_ENV"
          }
          read_secret REGISTRY_TOKEN_RO KAMAL_REGISTRY_PASSWORD secrets/prod.yaml
          read_secret DATABASE_URL DATABASE_URL secrets/prod.yaml
          read_secret BETTER_AUTH_SECRET BETTER_AUTH_SECRET secrets/prod.yaml
          read_secret SENTRY_DSN SENTRY_DSN secrets/prod.yaml
          # The pipeline's account, not the container's: the application never
          # signs in as anybody, so this lives with the pipeline's own tokens.
          read_optional SMOKE_EMAIL SHIP_SIGNIN_EMAIL secrets/ci.yaml
          read_optional SMOKE_PASSWORD SHIP_SIGNIN_PASSWORD secrets/ci.yaml

      # Fail rather than rebuild: recovering by rebuilding would deploy an
      # artifact nobody verified.
      - name: the validated artifact must exist
        run: |
          set -eu
          # The run's own token, not the machine's credential. This step only
          # asks whether a tag exists, and asking is a read - so the stored
          # credential stops being decrypted onto a runner here. That matters
          # beyond tidiness: being decrypted onto a runner is how the previous
          # registry token ended up in a log.
          printf '%s' '${{ github.token }}' \
            | docker login '${{ inputs.registry }}' -u '${{ github.actor }}' --password-stdin
          docker buildx imagetools inspect \
            "${{ inputs.registry }}/${{ inputs.image }}:${{ inputs.sha }}-production" > /dev/null
          echo "promoting ${{ inputs.sha }}-production"

      # Read before anything changes. After the deploy this answers about the
      # new image, and the question is what production was running BEFORE - the
      # image an automatic rollback would return to.
      # An action, not a path: written as a path it resolved against the
      # project's checkout, where these files do not exist, and
      # continue-on-error turned that into the word "unknown". The rollback
      # decision then read unknown as "not safe", which is the right answer for
      # the wrong reason - the check was blind rather than cautious. Third time
      # this path mistake appeared today.
      #
      # continue-on-error stays: production being unreachable is a fact this
      # release must proceed past, not a reason to refuse to deploy. What it
      # must not hide is a broken check, which calling the action fixes.
      - id: before
        continue-on-error: true
        uses: gutnikov/onemanshow/.github/actions/production-commit@main
        with:
          health_url: https://${{ inputs.domain }}/alive

      # No tunnel. The database is not on the machine, so the address the
      # application uses is the address migrations use - one value instead of
      # two that have to agree, and they did once drift.
      # Before anything is changed, and against the artifact already running -
      # the one thing in this release known to work. A failure here is a stale
      # credential or a production that was already unwell, not this change, and
      # the release stops with nothing migrated, deployed or rolled back.
      #
      # This is what makes the check after the deploy attributable. One probe
      # cannot tell "the release broke signing in" from "the stored password is
      # wrong", and the right response to those is opposite.
      - name: signing in must work before this release touches anything
        id: signin_before
        env: { SHIP_URL: "https://${{ inputs.domain }}" }
        uses: gutnikov/onemanshow/.github/actions/run-hook@main
        with: { name: signin }

      - name: migrate production
        id: migrate
        run: ./ship/migrate

      - name: deploy
        id: deploy
        uses: gutnikov/onemanshow/.github/actions/kamal@main
        with: { args: "deploy --skip-push --version ${{ inputs.sha }}-production" }

      # The deep check, explicit and in the pipeline. It used to be the proxy's
      # health check path, which made a load-bearing guarantee an implicit
      # consequence of a setting - and readiness detecting a schema *ahead* of
      # the code is what makes a bad rollback fail, which the rollback decision
      # below rests on. Too important to be a side effect.
      - name: production must be ready, not merely alive
        run: |
          set -eu
          i=0
          while [ "$i" -lt 30 ]; do
            body="$(curl -sS --max-time 10 "https://${{ inputs.domain }}/health" || true)"
            case "$body" in
              *'"ready":true'*) echo "ready: $body"; exit 0 ;;
              *'"schema-ahead"'*)
                echo "::error::the deployed code is older than the schema it found." \
                     "That is the state a rollback leaves, and it is not healthy:" \
                     "$body"
                exit 1 ;;
            esac
            i=$((i + 1)); sleep 2
          done
          echo "::error::production did not become ready within 60s of the deploy: ${body:-no response}"
          exit 1

      - name: smoke
        id: smoke
        continue-on-error: true
        env: { SHIP_URL: "https://${{ inputs.domain }}" }
        uses: gutnikov/onemanshow/.github/actions/run-hook@main
        with: { name: smoke }

      # The same check as before the deploy, and the position is the whole
      # meaning: the credential was already proved good, so a failure now is
      # this release's.
      - name: signing in must still work after it
        id: signin_after
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        env: { SHIP_URL: "https://${{ inputs.domain }}" }
        uses: gutnikov/onemanshow/.github/actions/run-hook@main
        with: { name: signin }

      # One verdict for the two checks that run against the deployed artifact,
      # so the rollback decision has a single thing to read. Written out rather
      # than repeated in four conditions, which is how the deployable-path list
      # went out of step with itself.
      - name: what the deployed artifact answered
        id: verdict
        if: always() && steps.deploy.outcome == 'success'
        run: |
          set -eu
          if [ '${{ steps.smoke.outcome }}' = 'failure' ] \
            || [ '${{ steps.signin_after.outcome }}' = 'failure' ]; then
            echo 'failed=yes' >> "$GITHUB_OUTPUT"
          else
            echo 'failed=no' >> "$GITHUB_OUTPUT"
          fi

      # Whether rewinding the image is a recovery or a second failure.
      #
      # Migrations run before the deploy, so after a release that added one the
      # schema has already moved. Rewinding the image then leaves old code
      # against a newer schema, which readiness reports as schema-ahead and
      # refuses to call healthy - the rollback fails its own health check and
      # production ends up broken in a second way rather than restored.
      #
      # So the rollback is automatic exactly where it is safe, and a person is
      # called exactly where it is not. Unknown counts as not safe.
      - id: migrated
        if: steps.verdict.outputs.failed == 'yes'
        uses: gutnikov/onemanshow/.github/actions/migration-in-release@main
        with:
          from: ${{ steps.before.outputs.sha }}
          to: ${{ inputs.sha }}

      - name: roll back, once, if production is not healthy and no schema moved
        id: rollback
        if: steps.verdict.outputs.failed == 'yes' && steps.migrated.outputs.migrated == 'no'
        uses: gutnikov/onemanshow/.github/actions/rollback@main
        with:
          url: "https://${{ inputs.domain }}"
          service: ${{ inputs.service }}

      - name: why the rollback was not attempted
        if: steps.verdict.outputs.failed == 'yes' && steps.migrated.outputs.migrated != 'no'
        run: |
          echo "::error::Smoke failed and this release ${{ steps.migrated.outputs.migrated == 'yes' && 'applied a migration' || 'may have applied a migration - it could not be determined' }}." \
               "Rewinding the image would leave the previous code against a schema that has moved on," \
               "which readiness refuses to call healthy - so it would fail its own health check and add" \
               "a second failure rather than restore anything. A person has to decide: forward-fix, or" \
               "roll the schema back too. The change is marked blocked:rollback."

      - name: report the incident
        if: steps.verdict.outputs.failed == 'yes'
        run: |
          echo "::error::Smoke failed after deploying ${{ inputs.sha }}." \
               "Production was rolled back one step. This is an incident, not a retry."
          exit 1

      # The release landing is what opens the observation window, so the
      # transition belongs here. always(): a failed release needs to reach a
      # person more than a successful one does.
      # What actually happened to production, derived from the steps that could
      # have changed it rather than from the release having failed. The two are
      # different half the time, and they differ exactly when somebody is
      # reading the answer to decide what to do.
      - name: what happened to production
        id: production
        if: always()
        run: |
          set -eu
          if [ '${{ steps.rollback.outputs.rewound }}' = 'yes' ]; then
            state=rewound
          elif [ '${{ steps.deploy.outcome }}' = 'success' ]; then
            state=deployed
          elif [ '${{ steps.migrate.outcome }}' = 'success' ]; then
            state=migrated
          else
            state=untouched
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "production is $state"

      - id: ticket
        if: always()
        uses: gutnikov/onemanshow/.github/actions/ticket-status@main
        with:
          sha: ${{ inputs.sha }}
          token: ${{ github.token }}
      - name: open the observation window
        if: always() && steps.ticket.outputs.ticket != ''
        uses: gutnikov/onemanshow/.github/actions/open-window@main
        with:
          ticket: ${{ steps.ticket.outputs.ticket }}
          sha: ${{ inputs.sha }}
          outcome: ${{ job.status }}
          production: ${{ steps.production.outputs.state }}
          status: ${{ steps.ticket.outputs.status }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          token: ${{ github.token }}
