# Rollback, bounded to exactly one step.
#
# The refusals matter more than the action. A system that keeps stepping back
# until verification passes never terminates when a migration has already been
# applied: the schema is new, every older image is older code, and each further
# step is another wrong version in production. So: one step, then a human.
name: rollback

on:
  workflow_call:
    inputs:
      url: { required: true, type: string }
    secrets:
      registry_user: { required: true }
      registry_token: { required: true }
      age_key: { required: true }
      ssh_key: { required: true }
      host: { required: true }

jobs:
  rollback:
    runs-on: ubuntu-latest
    env:
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.registry_token }}
      SOPS_AGE_KEY: ${{ secrets.age_key }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: gem install kamal -v 2.5.3 --no-document

      - name: authorise ssh
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.ssh_key }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.host }}" >> ~/.ssh/known_hosts

      # Refusing a rollback of a rollback needs no stored flag. Production
      # equals main whenever nothing is unresolved, so production being behind
      # main IS the record that a rollback is already in effect. Automation does
      # not get to fix its own fix.
      - name: refuse if a rollback is already unresolved
        run: |
          DEPLOYED="$(kamal app version -d production | tail -1)"
          MAIN="$(git rev-parse origin/main)"
          echo "deployed=${DEPLOYED} main=${MAIN}"
          if [ "${DEPLOYED}" != "${MAIN}" ]; then
            echo "refusing: production is already behind main, so a rollback is unresolved." >&2
            echo "This needs a person: rolling back again would only move further from main." >&2
            exit 1
          fi

      - name: roll back one step
        run: kamal rollback

      - name: verify the rolled-back version
        id: verify
        continue-on-error: true
        env: { SHIP_URL: "${{ inputs.url }}" }
        run: .github/scripts/hook smoke

      # The cascade guard. If the previous version fails too, the cause is not
      # the image - most likely a migration that has already been applied and
      # that older code cannot work against. Stop and escalate.
      - name: stop and escalate rather than stepping back again
        if: ${{ steps.verify.outcome == 'failure' }}
        run: |
          echo "The rolled-back version also fails verification." >&2
          echo "No further rollback will be attempted: stepping further back cannot" >&2
          echo "help when the schema has moved. A person must decide." >&2
          exit 1
