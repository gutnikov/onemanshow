# Manual rollback. The logic lives in the rollback action, shared with the
# release workflow, so the refusals cannot drift between the two.
name: rollback

on:
  workflow_call:
    inputs:
      image:
        description: Repository path WITHOUT the registry host
        required: true
        type: string
      registry:
        description: >
          Registry host, e.g. ghcr.io. Required rather than defaulted so a stub
          that forgets it is caught by the stub checker instead of resolving to
          Docker Hub in one code path and the configured host in another.
        required: true
        type: string
      registry_user: { required: true, type: string }
      host: { required: true, type: string }
      domain: { required: true, type: string }
      service: { description: Service name of the production destination, required: true, type: string }
      host_key: { required: false, type: string, default: "" }
    secrets:
      SOPS_AGE_KEY: { required: true }
      SSH_PRIVATE_KEY: { required: true }

jobs:
  rollback:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      SHIP_IMAGE: ${{ inputs.image }}
      SHIP_HOST: ${{ inputs.host }}
      SHIP_DOMAIN: ${{ inputs.domain }}
      SHIP_REGISTRY_USER: ${{ inputs.registry_user }}
      SHIP_REGISTRY_SERVER: ${{ inputs.registry }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: install sops
        run: |
          curl -fsSL -o /tmp/sops https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
      - uses: gutnikov/onemanshow/.github/actions/ssh-agentless@main
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          host: ${{ inputs.host }}
          host_key: ${{ inputs.host_key }}
      - name: read production credentials
        run: |
          set -eu
          read_secret() {
            v="$(sops -d --extract "[\"$1\"]" "secrets/prod.yaml")"
            echo "::add-mask::$v"
            echo "$2=$v" >> "$GITHUB_ENV"
          }
          # Derived from the file that declares what the deploy tool needs, not
          # listed here. The hand-written list is why a rollback could not boot
          # the application at all: BETTER_AUTH_SECRET was added to the app
          # months of work ago and never to this list, so the container crashed
          # on start and the rollback died on a health timeout - during the one
          # procedure that exists for incidents.
          #
          # KAMAL_REGISTRY_PASSWORD is the one name that differs between the
          # deploy tool's file and the secret store, so it is the one mapping.
          for n in $(grep -oE '^[A-Z_]+' .kamal/secrets); do
            case "$n" in
              KAMAL_REGISTRY_PASSWORD) read_secret REGISTRY_TOKEN_RO KAMAL_REGISTRY_PASSWORD ;;
              *) read_secret "$n" "$n" ;;
            esac
          done
      - uses: gutnikov/onemanshow/.github/actions/rollback@main
        with:
          url: "https://${{ inputs.domain }}"
          service: ${{ inputs.service }}
