# Staging validation, in the two runs the spec requires.
#
# The baseline comes from the commit production is running, so the change's own
# migration executes against production's schema. Because that baseline also
# carries production's *data*, the first run uses only the content-agnostic
# smoke set - asserting on fixtures there would fail any change that touches
# them, through no fault of its own. The full suite runs afterwards, against
# data seeded at the change's own commit.
name: staging

on:
  workflow_call:
    inputs:
      image: { required: true, type: string }
      sha: { description: Commit under review, required: true, type: string }
      registry_user: { required: true, type: string }
      host: { required: true, type: string }
      domain: { description: Production host name, required: true, type: string }
      staging_domain: { required: true, type: string }
      staging_volume: { required: true, type: string }
      staging_db_container: { required: true, type: string }
      host_key:
        description: known_hosts line for the machine, from ssh-keyscan. Not a secret.
        required: false
        type: string
        default: ""
    secrets:
      SOPS_AGE_KEY: { required: true }
      SSH_PRIVATE_KEY: { required: true }

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      SHIP_IMAGE: ${{ inputs.image }}
      SHIP_HOST: ${{ inputs.host }}
      SHIP_DOMAIN: ${{ inputs.domain }}
      SHIP_STAGING_DOMAIN: ${{ inputs.staging_domain }}
      SHIP_REGISTRY_USER: ${{ inputs.registry_user }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund

      - name: install sops
        run: |
          curl -fsSL -o /tmp/sops https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops

      - uses: gutnikov/onemanshow/.github/actions/ssh-agentless@main
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          host: ${{ inputs.host }}
          host_key: ${{ inputs.host_key }}

      # Actions masks values that came from secrets.*, and nothing else. A value
      # decrypted here and exported is printed verbatim in the step's env dump,
      # so every one is registered for masking first. Without this the whole
      # arrangement leaks a project's credentials into its own build logs.
      - name: read staging credentials
        run: |
          set -eu
          read_secret() {
            v="$(sops -d --extract "[\"$1\"]" "secrets/staging.yaml")"
            echo "::add-mask::$v"
            echo "$2=$v" >> "$GITHUB_ENV"
          }
          read_secret REGISTRY_TOKEN_RO KAMAL_REGISTRY_PASSWORD
          read_secret DATABASE_URL DATABASE_URL
          read_secret POSTGRES_PASSWORD POSTGRES_PASSWORD
          read_secret DATABASE_URL_TUNNEL DATABASE_URL_TUNNEL

      # Production's version tag carries a destination suffix; the commit is
      # what the baseline needs, so the suffix is stripped.
      # Production's version tag carries a destination suffix; the commit is
      # what the baseline needs, so the suffix is stripped.
      #
      # Piping this into tail once turned a failed container run into an empty
      # string and a green step - a silently wrong baseline is worse than a
      # broken one, so the result is now validated as a commit before use.
      - name: read the commit production is running
        id: prod
        run: |
          set -u
          # Capturing with out="$(cmd)" under set -e aborts the script at the
          # assignment, so an error branch written after it never runs and the
          # tool's own message - which it prints on stdout, into the capture -
          # is never seen. Hence "if ! out=..." with stderr folded in.
          if ! out="$(docker run --rm -v "$PWD:/workdir" -v "$HOME/.ssh:/root/.ssh:ro" \
                       -e SHIP_IMAGE -e SHIP_HOST -e SHIP_DOMAIN -e SHIP_REGISTRY_USER \
                       -e KAMAL_REGISTRY_PASSWORD -e DATABASE_URL -e POSTGRES_PASSWORD \
                       ghcr.io/basecamp/kamal:v2.12.0 app version 2>&1)"; then
            echo "kamal app version failed:" >&2
            printf '%s\n' "$out" >&2
            exit 1
          fi
          sha="$(printf '%s\n' "$out" | grep -oE '^[0-9a-f]{40}' | tail -1 || true)"
          if [ -z "$sha" ]; then
            echo "could not read production's version, got:" >&2
            printf '%s\n' "$out" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "production runs $sha"

      - name: destroy the staging data plane
        uses: gutnikov/onemanshow/.github/actions/reset-staging@main
        with:
          host: ${{ inputs.host }}
          volume: ${{ inputs.staging_volume }}
          container: ${{ inputs.staging_db_container }}

      - name: bring an empty staging database back
        uses: gutnikov/onemanshow/.github/actions/kamal@main
        with: { args: accessory boot db -d staging }

      - name: open a tunnel to the staging database
        run: |
          ssh -f -N -L 15433:localhost:5433 "root@${{ inputs.host }}"
          echo "TUNNEL=postgres tunnel on 15433" >> "$GITHUB_ENV"

      # Baseline: production's schema and data, produced by production's code.
      - name: migrate and seed at production's commit
        run: |
          git worktree add /tmp/baseline "${{ steps.prod.outputs.sha }}"
          ln -s "$PWD/node_modules" /tmp/baseline/node_modules
          cd /tmp/baseline
          DATABASE_URL="$DATABASE_URL_TUNNEL" ./ship/migrate
          DATABASE_URL="$DATABASE_URL_TUNNEL" ./ship/seed

      - name: deploy the change under review
        uses: gutnikov/onemanshow/.github/actions/kamal@main
        with: { args: "deploy --skip-push --version ${{ inputs.sha }}-staging -d staging" }

      - name: migrate at the commit under review
        run: DATABASE_URL="$DATABASE_URL_TUNNEL" ./ship/migrate

      # First run: did the migration break the application against real-shaped
      # data? Content-agnostic, because the data here is not this change's.
      - name: migration safety
        env: { SHIP_URL: "https://${{ inputs.staging_domain }}" }
        uses: gutnikov/onemanshow/.github/actions/run-hook@main
        with: { name: smoke }

      # Reset between the two runs: the suite must see the fixtures it was
      # written against, not production's data.
      - name: destroy the staging data plane again
        uses: gutnikov/onemanshow/.github/actions/reset-staging@main
        with:
          host: ${{ inputs.host }}
          volume: ${{ inputs.staging_volume }}
          container: ${{ inputs.staging_db_container }}

      - name: bring the staging database back
        uses: gutnikov/onemanshow/.github/actions/kamal@main
        with: { args: accessory boot db -d staging }

      - name: reopen the tunnel and seed at the commit under review
        run: |
          pkill -f '15433:localhost:5433' || true
          ssh -f -N -L 15433:localhost:5433 "root@${{ inputs.host }}"
          DATABASE_URL="$DATABASE_URL_TUNNEL" ./ship/migrate
          DATABASE_URL="$DATABASE_URL_TUNNEL" ./ship/seed

      # Second run: is the change itself right? Against its own fixtures.
      - name: feature correctness
        env: { SHIP_URL: "https://${{ inputs.staging_domain }}" }
        uses: gutnikov/onemanshow/.github/actions/run-hook@main
        with: { name: e2e }
