# Staging validation, in the two runs the spec requires.
#
# The baseline is production's schema produced by production's code, with the
# change's migration applied on top. The data is synthetic throughout - a branch
# of production would be cheaper and would put real user data where a browser and
# a test suite reach it, and that is refused.
#
# The first run therefore uses only the content-agnostic smoke set: the data
# present is not the data this change's fixtures describe, and asserting on
# content there fails every change that touches them. The full suite runs
# afterwards, against data seeded at the change's own commit.
name: staging

on:
  workflow_call:
    inputs:
      image:
        description: Repository path WITHOUT the registry host, which the deploy tool prepends from its own config
        required: true
        type: string
      sha: { description: Commit under review, required: true, type: string }
      registry_user: { required: true, type: string }
      host: { required: true, type: string }
      domain: { description: Production host name, required: true, type: string }
      staging_domain: { required: true, type: string }
      host_key:
        description: known_hosts line for the machine, from ssh-keyscan. Not a secret.
        required: false
        type: string
        default: ""
    secrets:
      SOPS_AGE_KEY: { required: true }
      SSH_PRIVATE_KEY: { required: true }

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      statuses: write
      pull-requests: read
      contents: read
    env:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
      SHIP_IMAGE: ${{ inputs.image }}
      SHIP_HOST: ${{ inputs.host }}
      SHIP_DOMAIN: ${{ inputs.domain }}
      SHIP_STAGING_DOMAIN: ${{ inputs.staging_domain }}
      SHIP_REGISTRY_USER: ${{ inputs.registry_user }}
      SHIP_SSH_LOG_LEVEL: debug
    steps:
      # A 40-hex commit, checked before anything acts on it. Passing an
      # abbreviated one got as far as the deploy and failed there as an image
      # "not found", which reads like a build problem rather than a bad argument.
      - name: the sha must be a full commit
        run: |
          case "${{ inputs.sha }}" in
            *[!0-9a-f]* | "") bad=1 ;;
            ????????????????????????????????????????) bad= ;;
            *) bad=1 ;;
          esac
          if [ -n "$bad" ]; then
            echo "::error::sha must be a full 40-character commit, got '${{ inputs.sha }}'"
            exit 1
          fi

      # Pinned to the commit under review. Left unpinned this resolves to the
      # branch the dispatch ran on, and then every step labelled "at the commit
      # under review" silently used that branch's code: its migrations, its seed,
      # its tests. A change that moved a fixture was then validated by seeding
      # that branch's value and asserting its expectation, which agree - so the
      # run was green and proved nothing. fetch-depth 0 is needed for the
      # baseline worktree below.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund

      - name: install sops
        run: |
          curl -fsSL -o /tmp/sops https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops

      # Still needed: the deploy tool reaches the machine over ssh. The database
      # no longer does, which is what removed the tunnel whose port was written
      # in a workflow and a secret at once and drifted between them.
      - uses: gutnikov/onemanshow/.github/actions/ssh-agentless@main
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          host: ${{ inputs.host }}
          host_key: ${{ inputs.host_key }}

      # Actions masks values that came from secrets.*, and nothing else. A value
      # decrypted here and exported is printed verbatim in the step's env dump,
      # so every one is registered for masking first. Without this the whole
      # arrangement leaks a project's credentials into its own build logs.
      - name: read staging credentials
        run: |
          set -eu
          read_secret() {
            v="$(sops -d --extract "[\"$1\"]" "$3")"
            echo "::add-mask::$v"
            echo "$2=$v" >> "$GITHUB_ENV"
          }
          read_secret REGISTRY_TOKEN_RO KAMAL_REGISTRY_PASSWORD secrets/staging.yaml
          read_secret SENTRY_DSN SENTRY_DSN secrets/staging.yaml
          # Declared in .kamal/secrets and resolved by the deploy tool, so it
          # must be present even though nothing uses it any more: the accessory
          # it belonged to is not booted for staging. It leaves when production
          # leaves, so that the declaration and the reality change together.
          read_secret POSTGRES_PASSWORD POSTGRES_PASSWORD secrets/staging.yaml
          read_secret NEON_API_KEY NEON_API_KEY secrets/ci.yaml
          echo "STAGING_PROJECT=$(python3 -c "import yaml;print(yaml.safe_load(open('ship.yml'))['roles']['database']['staging_project'])")" >> "$GITHUB_ENV"

      # Production's own answer, over HTTP. It used to be read by running the
      # deploy tool on the machine, which needed ssh, a container and a pipe
      # that once turned a failure into an empty string and a green step.
      - id: prod
        run: |
          set -eu
          sha="$(.github/actions/production-commit/production-commit "https://${{ inputs.domain }}/health")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "production runs $sha"

      # Created, not emptied. The action this replaces removed a named volume
      # while the data lived in a bind mount, so it destroyed nothing and said
      # it had. A branch that has just been created cannot contain residue, and
      # the action checks that it does not.
      - id: branch
        uses: gutnikov/onemanshow/.github/actions/staging-branch@main
        with:
          mode: create
          name: v-${{ github.run_id }}
          project: ${{ env.STAGING_PROJECT }}
          key: ${{ env.NEON_API_KEY }}

      - name: make the branch the environment's database
        run: |
          echo "::add-mask::${{ steps.branch.outputs.url }}"
          echo "DATABASE_URL=${{ steps.branch.outputs.url }}" >> "$GITHUB_ENV"

      # Baseline: production's schema, produced by production's code.
      - name: migrate and seed at production's commit
        run: |
          git worktree add /tmp/baseline "${{ steps.prod.outputs.sha }}"
          ln -s "$PWD/node_modules" /tmp/baseline/node_modules
          cd /tmp/baseline
          ./ship/migrate
          ./ship/seed

      # The migration is applied before the image that requires it is deployed.
      # The other order leaves a window where the schema is behind the code, and
      # readiness refuses to call that healthy - correctly, which is how this
      # ordering bug surfaced. The release already did it this way round; staging
      # did not, and only a migration that is not backward compatible could
      # reveal the difference.
      - name: migrate at the commit under review
        run: ./ship/migrate

      - name: deploy the change under review
        uses: gutnikov/onemanshow/.github/actions/kamal@main
        with: { args: "deploy --skip-push --version ${{ inputs.sha }}-staging -d staging" }

      # First run: did the migration break the application against data shaped
      # like production's? Content-agnostic, because the data here is not this
      # change's.
      - name: migration safety
        env: { SHIP_URL: "https://${{ inputs.staging_domain }}" }
        uses: gutnikov/onemanshow/.github/actions/run-hook@main
        with: { name: smoke }

      # Emptied between the runs by restoring the branch to its parent. The
      # endpoint survives that, so the connection string is unchanged and the
      # application is not redeployed - which is why this is a restore and not
      # a second branch.
      - name: empty the branch between the two runs
        uses: gutnikov/onemanshow/.github/actions/staging-branch@main
        with:
          mode: restore
          branch_id: ${{ steps.branch.outputs.branch_id }}
          project: ${{ env.STAGING_PROJECT }}
          key: ${{ env.NEON_API_KEY }}

      - name: seed at the commit under review
        run: |
          ./ship/migrate
          ./ship/seed

      # The restore deletes the timeline the running application holds
      # connections to, so its first request afterwards may fail while it
      # reconnects. Waiting for readiness turns that into a pause instead of a
      # test failure blamed on the change.
      - name: wait for the application to be ready again
        env: { SHIP_URL: "https://${{ inputs.staging_domain }}" }
        run: |
          set -eu
          i=0
          while [ "$i" -lt 30 ]; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${SHIP_URL}/health" || true)"
            [ "$code" = 200 ] && { echo "ready after ${i}s"; exit 0; }
            i=$((i + 1)); sleep 1
          done
          echo "::error::the application did not become ready within 30s of the database being emptied and reseeded"
          exit 1

      # Second run: is the change itself right? Against its own fixtures.
      - name: feature correctness
        env: { SHIP_URL: "https://${{ inputs.staging_domain }}" }
        uses: gutnikov/onemanshow/.github/actions/run-hook@main
        with: { name: e2e }

      # The record that THIS commit passed, written only after both runs. A
      # dispatched run cannot be asked what it validated - it reports the branch
      # it was dispatched from - so without this the merge guard has no evidence
      # about the change and would have to trust a run's own commit, which is
      # evidence about something else.
      - name: record that this commit passed validation
        uses: gutnikov/onemanshow/.github/actions/validation-mark@main
        with:
          mode: set
          sha: ${{ inputs.sha }}
          target_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          token: ${{ github.token }}

      # always(): a branch left behind consumes an allowance of ten, and a
      # failed run is exactly when nobody is watching.
      - name: give the branch back
        if: always()
        uses: gutnikov/onemanshow/.github/actions/staging-branch@main
        with:
          mode: delete
          branch_id: ${{ steps.branch.outputs.branch_id }}
          project: ${{ env.STAGING_PROJECT }}
          key: ${{ env.NEON_API_KEY }}

      # always(): the red path is the one that most needs to reach a person, and
      # a report that only happens on success says nothing when it matters.
      - id: ticket
        if: always()
        uses: gutnikov/onemanshow/.github/actions/ticket-status@main
        with:
          sha: ${{ inputs.sha }}
          token: ${{ github.token }}
      - name: record the outcome in the thread
        if: always() && steps.ticket.outputs.ticket != ''
        uses: gutnikov/onemanshow/.github/actions/report-staging@main
        with:
          ticket: ${{ steps.ticket.outputs.ticket }}
          sha: ${{ inputs.sha }}
          outcome: ${{ job.status }}
          stand_url: https://${{ inputs.staging_domain }}
          run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          token: ${{ github.token }}
