# Instance wiring: no placeholders. See this directory's README.
#
# Point the monitor's webhook at a repository_dispatch with event_type
# "liveness" and a payload of {status, code, at}. Nothing else is read.
name: on liveness
on:
  repository_dispatch:
    types: [liveness]
jobs:
  signal:
    uses: gutnikov/onemanshow/.github/workflows/liveness.yml@main
