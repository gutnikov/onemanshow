# Instance wiring: no placeholders. See this directory's README.
#
# The dump lands in an artifact in the same account as the repository and the
# deploy credentials, which is the one loss it cannot survive. Moving the
# destination to the machine - which no longer has anything to do with the
# database - is what makes it cover losing this account.
name: backup
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  backup:
    uses: gutnikov/onemanshow/.github/workflows/backup.yml@main
    secrets: inherit
