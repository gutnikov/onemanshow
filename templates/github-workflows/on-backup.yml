# Instance wiring: replace every REPLACE_ME. See this directory's README.
#
# The dumps are kept on the machine, which after the database moved has nothing
# to do with it - so they survive losing this code host and losing the database
# provider. They do not survive losing the machine's provider, and that is the
# residual loss, named rather than left to be assumed covered.
name: backup
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      keep:
        description: How many dumps to keep, for a deliberate prune or a test of the limit
        required: false
        default: "14"
jobs:
  backup:
    uses: gutnikov/onemanshow/.github/workflows/backup.yml@main
    with:
      host: REPLACE_ME_SERVER_IP
      # Two weeks of daily dumps. The limit is enforced before writing, so the
      # disk never holds more than this even for a moment.
      keep: ${{ fromJSON(inputs.keep || '14') }}
      host_key: |
        REPLACE_ME_KNOWN_HOSTS_LINES
    secrets: inherit
