# Instance wiring: replace every REPLACE_ME and commit this to your own repo.
name: on pull request
on:
  pull_request: { branches: [main] }
  # So a person can validate a change when the host does not deliver the event.
  # It stalled for over an hour on 2026-08-26.
  workflow_dispatch:
jobs:
  pr:
    uses: gutnikov/onemanshow/.github/workflows/pr.yml@main
    with:
      # Without the registry host; see on-main.yml.
      # Derived, not typed. One package per instance repository: two instances
      # under one owner would otherwise collide on one package, and the second
      # one's token cannot push to a package linked to the first.
      image: ${{ github.repository }}
      registry: ghcr.io
      # The account the machine logs in as. On ghcr that is the repository
      # owner, not a separate registry account.
      registry_user: ${{ github.repository_owner }}
      service: onemanshow
      staging_service: onemanshow-staging
    secrets: inherit
