# Instance wiring: replace every REPLACE_ME. See this directory's README.
#
# Run once, by hand, after the managed database has carried production for long
# enough to trust. It refuses if production still talks to the database it is
# about to delete.
name: retire database
on:
  workflow_dispatch:
    inputs:
      destinations:
        description: Space-separated destinations, for example "staging" or "staging production"
        required: true
        default: staging
jobs:
  retire:
    uses: gutnikov/onemanshow/.github/workflows/retire-database.yml@main
    with:
      host: REPLACE_ME_SERVER_IP
      domain: REPLACE_ME_PRODUCTION_HOSTNAME
      # Derived, not typed. One package per instance repository: two instances
      # under one owner would otherwise collide on one package, and the second
      # one's token cannot push to a package linked to the first.
      image: ${{ github.repository }}
      registry: ghcr.io
      # The account the machine logs in as. On ghcr that is the repository
      # owner, not a separate registry account.
      registry_user: ${{ github.repository_owner }}
      destinations: ${{ inputs.destinations }}
      host_key: |
        REPLACE_ME_KNOWN_HOSTS_LINES
    secrets: inherit
