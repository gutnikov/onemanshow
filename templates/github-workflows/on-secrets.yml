# Instance wiring: replace every REPLACE_ME. See this directory's README.
#
# Secrets are excluded from the release trigger because a secrets commit has no
# artifact to promote. This is how such a change reaches production: the version
# already running is deployed again, so only the configuration around it moves.
name: on secrets
on:
  push:
    branches: [main]
    paths:
      - 'secrets/**'
      - '.sops.yaml'
  workflow_dispatch:
jobs:
  reconfigure:
    uses: gutnikov/onemanshow/.github/workflows/reconfigure.yml@main
    with:
      image: REPLACE_ME_DOCKERHUB_USER/onemanshow-reference
      registry_user: REPLACE_ME_DOCKERHUB_USER
      host: REPLACE_ME_SERVER_IP
      domain: REPLACE_ME_PRODUCTION_HOSTNAME
      service: onemanshow
      host_key: |
        REPLACE_ME_KNOWN_HOSTS_LINES
    secrets: inherit
