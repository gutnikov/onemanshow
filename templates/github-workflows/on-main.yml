# Instance wiring: replace every REPLACE_ME and commit this to your own repo.
#
# paths-ignore is load-bearing, not tidiness. Without it every commit to main
# releases, including the documentation commit that closes a change - and that
# release FAILS, because the release promotes a pre-validated image and refuses
# to build one, so a commit that never went through a pull request has no image
# to promote. The damage is not a bad deploy, it is a red release every time a
# change closes plus production left unequal to main's tip, which trips the
# fourth merge guard and blocks the next change. Red as a matter of routine is
# red nobody reads; this pipeline once sat three commits behind production
# behind exactly that signal.
#
# Keep this as an EXCLUSION list, never a list of deployable paths. A path
# missing here fails loudly at promotion. A path missing from a deployable list
# would mean a real change silently never deploys, while the guard - computed
# from the same list - reports agreement.
#
# The consequence is that main's tip is not always what production runs. The
# invariant is therefore "production equals the most recent commit on main
# that touched a deployable path" - see reference/gates.md, which carries the
# command that reads it.
name: on main
on:
  push:
    branches: [main]
    paths-ignore:
      - 'openspec/**'
      - '.claude/**'
      - '.github/**'
      - 'templates/**'
      - 'provision/**'
      # Helper scripts for the pipeline itself, not part of the artifact.
      # Adding one released, the release failed for want of an image, and the
      # fourth merge guard found the residue - which is the exclusion list
      # working as chosen: a path missing from it fails loudly.
      - 'scripts/**'
      - 'ship.yml'
      # Secrets change what the container is given, not what the image
      # contains, so a release has no artifact to promote for such a commit and
      # fails. Excluded to stop the failed release - but a rotated credential
      # then does not reach production until something redeploys the running
      # version, and nothing looks wrong until the old credential is revoked.
      - 'secrets/**'
      - '.sops.yaml'
      - '**/*.md'
      - LICENSE
  workflow_dispatch:
jobs:
  release:
    uses: gutnikov/onemanshow/.github/workflows/release.yml@main
    with:
      # Repository path WITHOUT the registry host - the deploy tool prepends
      # that from its own config. Including it produced docker.io/docker.io/...
      image: REPLACE_ME_DOCKERHUB_USER/onemanshow-reference
      sha: ${{ github.sha }}
      registry_user: REPLACE_ME_DOCKERHUB_USER
      host: REPLACE_ME_SERVER_IP
      domain: REPLACE_ME_PRODUCTION_HOSTNAME
      service: onemanshow
      # From `ssh-keyscan REPLACE_ME_SERVER_IP`. Not a secret; pinning it stops
      # the deploy trusting whatever answers.
      host_key: |
        REPLACE_ME_KNOWN_HOSTS_LINES
    secrets: inherit
