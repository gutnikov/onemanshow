# Shape only. Copy to ci.yaml and encrypt with sops before adding values.
#
# What the *pipeline* uses, as opposed to prod.yaml and staging.yaml, which are
# what the container is given. Keeping them apart is not tidiness: a value the
# application never reads has no business redeploying it, and one of these was
# put in prod.yaml first and redeployed production for nothing.
# No registry write token. The build pushes with the run's own token and
# `packages: write` declared, so this used to be a credential whose only job was
# to be rotated.
SENTRY_AUTH_TOKEN: ''
SENTRY_READ_TOKEN: ''
# The provider key the validation branches are created with. Scope it to the
# staging project: the pipeline has no reason to reach production's database,
# and verify-secrets checks that in both directions.
NEON_API_KEY: ''
# The synthetic account `ship/signin` uses against production. It belongs to
# nobody, owns no data, and is alone in its own organisation. Leave both empty
# if the application has no accounts - the hook's absence is what reports that.
SMOKE_EMAIL: ''
SMOKE_PASSWORD: ''
