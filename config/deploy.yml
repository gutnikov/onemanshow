# Kamal, base configuration shared by both destinations.
#
# No instance data lives here. Hosts, image and domains come from the
# environment through ERB, because this file ships in a template: a real IP
# committed here would point every project created from it at somebody else's
# machine. Values arrive from secrets/ locally and from Actions in CI.
service: onemanshow
image: <%= ENV.fetch("SHIP_IMAGE") %>

servers:
  web:
    - <%= ENV.fetch("SHIP_HOST") %>

# Kamal connects through Ruby's Net::SSH, which does not honour an OpenSSH
# client config, so the key and the host-verification policy are stated here
# rather than assumed from ~/.ssh/config. Host keys are still verified; the
# entries come from ssh-keyscan and are supplied by the caller.
ssh:
  keys_only: true
  keys:
    - /root/.ssh/id_ed25519
  # config takes a list of paths, not a boolean - Net::SSH ignores the client
  # config entirely unless the files are named, which is why a pinned
  # known_hosts had no effect and it reported HostKeyUnknown for the very key
  # that had been pinned.
  config:
    - /root/.ssh/config
  log_level: <%= ENV.fetch("SHIP_SSH_LOG_LEVEL", "fatal") %>

proxy:
  ssl: true
  host: <%= ENV.fetch("SHIP_DOMAIN") %>
  app_port: 3000
  # Liveness, not readiness. Whether this proxy polls continuously is a fact
  # this project does not have - and pointing it here makes the fact irrelevant,
  # which is better than depending on it either way. The check that readiness
  # exists for, refusing a container whose schema has moved past its code, is an
  # explicit step in the release where it can be seen.
  healthcheck:
    path: /alive

registry:
  server: <%= ENV.fetch("SHIP_REGISTRY_SERVER", "docker.io") %>
  username: <%= ENV.fetch("SHIP_REGISTRY_USER") %>
  password:
    - KAMAL_REGISTRY_PASSWORD

# Images are built in CI and only ever promoted here. Building on this machine
# would execute dependency install scripts next to production secrets.
builder:
  arch: amd64

env:
  clear:
    PORT: 3000
    # The deliberate failure switch. Empty unless a change sets it, because
    # enabling it must be a change that travels the pipeline rather than a knob
    # somebody flips on a running container.
    # Quoted: an empty ERB result is nil in YAML, and the deploy tool requires
    # a string here.
    SHIP_BREAK_GREETING: "<%= ENV.fetch('SHIP_BREAK_GREETING', '') %>"
    # The host this environment answers on. Identity needs it: left unset, the
    # origin is taken from the incoming request, so callbacks and redirects
    # depend on whichever host a caller used - and the two environments differ
    # in exactly that. Overridden for staging.
    SHIP_PUBLIC_URL: https://<%= ENV.fetch("SHIP_DOMAIN") %>
  secret:
    - DATABASE_URL
    - SENTRY_DSN

# No accessories. The database is managed and off this machine, reached over the
# network at the address the application is given - so there is nothing here to
# publish on a port, nothing to bind to loopback, and no volume to reset.
#
# The comment that used to live here is worth keeping the point of: a published
# container port bypasses ufw entirely, because Docker writes its own iptables
# rules, so "5432:5432" would have put the database on the public internet while
# the firewall reported deny incoming. That hazard leaves with the accessory,
# and it is the reason to be suspicious of any port added here later.
